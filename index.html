<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="logo">Portfolio</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#categories">Work</a></li>
        </ul>
    </nav>

    <header class="hero">
        <!-- User will place their front page picture here -->
        <!-- Just save your image as 'front_cover.jpg' in assets/images/front/ -->
        <img src="assets/images/front/Untitled_Artwork.jpg" alt="Portfolio Cover" onerror="this.src='https://via.placeholder.com/1920x1080?text=Your+Front+Page+Picture+Here'">
        
        <div class="hero-overlay"></div>
        <div class="scroll-indicator">
            Scroll
        </div>
    </header>

    <section id="categories" class="categories">
        <h2 class="section-title fade-in">Selected Work</h2>
        
        <div class="category-grid">
            <!-- Digital Media -->
            <a href="digital_media.html" class="category-card fade-in" data-tilt>
                <div class="category-icon-wrapper">
                    <img src="assets/icons/digital_media.png" alt="Digital Media Icon">
                </div>
                <h3>Digital Media</h3>
                <p>View Gallery</p>
            </a>

            <!-- Mixed Media -->
            <a href="mixed_media.html" class="category-card fade-in" data-tilt style="transition-delay: 0.1s;">
                <div class="category-icon-wrapper">
                    <img src="assets/icons/mixed_media.png" alt="Mixed Media Icon">
                </div>
                <h3>Mixed Media</h3>
                <p>View Gallery</p>
            </a>

            <!-- Photography -->
            <a href="photography.html" class="category-card fade-in" data-tilt style="transition-delay: 0.2s;">
                <div class="category-icon-wrapper">
                    <img src="assets/icons/photography.png" alt="Photography Icon">
                </div>
                <h3>Photography</h3>
                <p>View Gallery</p>
            </a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Portfolio. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
